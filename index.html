<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviram Mizrahi RubyComm Assessment</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <header>
            <div class="header-content">
                <h1>RubyComm Assessment</h1>
                <p>Strategic Water Infrastructure & Geographical Visualization</p>
            </div>
        </header>

        <main>
            <div id="map"></div>

            <aside id="controls" class="glass-panel">
                <div class="control-section">
                    <h3>Map Layers</h3>
                    <div class="toggle-group">
                        <label class="toggle">
                            <input type="checkbox" id="toggle-strategic" checked>
                            <span class="slider strategic"></span>
                            <span class="label-text">Strategic Infrastructure</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" id="toggle-lines" checked>
                            <span class="slider"></span>
                            <span class="label-text">Waterways (Lines)</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" id="toggle-points" checked>
                            <span class="slider"></span>
                            <span class="label-text">General Infrastructure</span>
                        </label>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Legend</h3>
                    <ul class="legend-list">
                        <li><span class="color-box strategic"></span> Strategic Site</li>
                        <li><span class="color-box stream"></span> Stream</li>
                        <li><span class="color-box canal"></span> Canal / Ditch</li>
                        <li><span class="color-box waterfall"></span> Waterfall</li>
                        <li><span class="color-box dam"></span> Dam / Weir</li>
                        <li><span class="color-box other"></span> Other</li>
                    </ul>
                </div>

                <div class="info-footer">
                    <p>Source: OpenStreetMap / HotOSM</p>
                </div>
            </aside>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>

</html>
